<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devi可wed y p orir >
    <title>Dino Runner Mejorado</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid black;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Dino Runner Mejorado</h1>
    <p>Usa W A S D para moverte</p>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let dino = { x: 50, y: 150, width: 30, height: 30, velocityY: 0, gravity: 1, speed: 5 };
        let obstacle = { x: 800, y: 150, width: 30, height: 30 };
        let keys = {};
        let gameOver = false;
        let speedIncrease = 0.02;
        let obstacleSpeed = 5;
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "green";
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            ctx.fillStyle = "red";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        }
        
        function update() {
            if (!gameOver) {
                dino.velocityY += dino.gravity;
                dino.y += dino.velocityY;
                if (dino.y > 150) dino.y = 150;
                
                if (keys["w"] && dino.y === 150) dino.velocityY = -12;
                if (keys["a"] && dino.x > 0) dino.x -= dino.speed;
                if (keys["d"] && dino.x < canvas.width - dino.width) dino.x += dino.speed;
                
                obstacle.x -= obstacleSpeed;
                if (obstacle.x < -30) {
                    obstacle.x = 800;
                    obstacleSpeed += speedIncrease;
                }
                
                if (dino.x < obstacle.x + obstacle.width &&
                    dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height &&
                    dino.y + dino.height > obstacle.y) {
                    gameOver = true;
                    alert("¡Perdiste! Recarga para jugar otra vez.");
                }
            }
        }
        
        function gameLoop() {
            draw();
            update();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener("keydown", function(event) {
            keys[event.key.toLowerCase()] = true;
        });
        
        document.addEventListener("keyup", function(event) {
            keys[event.key.toLowerCase()] = false;
        });
        
        gameLoop();
    </script>
</body>
</html>
