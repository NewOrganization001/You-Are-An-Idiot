<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reproductor de Spritesheet estilo Beat Banger</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      color: white;
    }
    #dropzone {
      border: 2px dashed #888;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      width: 90%;
      max-width: 500px;
      margin-bottom: 20px;
    }
    canvas {
      border: 2px solid white;
      image-rendering: pixelated;
    }
    input {
      margin: 5px;
    }
  </style>
</head>
<body>
  <h2>Reproductor estilo Beat Banger</h2>
  <div id="dropzone">
    <p>Arrastra una imagen PNG tipo spritesheet aquí</p>
    <input type="number" id="cols" placeholder="Columnas (frames por fila)" />
    <input type="number" id="rows" placeholder="Filas" />
    <input type="number" id="speed" placeholder="Velocidad (ms por frame)" />
  </div>
  <canvas id="canvas" width="512" height="512"></canvas>

  <script>
    const dropzone = document.getElementById('dropzone');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let sheetImg, frameWidth, frameHeight;
    let cols, rows, speed;
    let currentFrame = 0;
    let interval;

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#fff';
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.style.borderColor = '#888';
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#888';
      const file = e.dataTransfer.files[0];
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (event) {
          sheetImg = new Image();
          sheetImg.onload = () => {
            clearInterval(interval);
            startAnimation();
          };
          sheetImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function startAnimation() {
      cols = parseInt(document.getElementById('cols').value);
      rows = parseInt(document.getElementById('rows').value);
      speed = parseInt(document.getElementById('speed').value);
      if (!cols || !rows || !speed) {
        alert('Por favor, llena todos los campos (columnas, filas y velocidad).');
        return;
      }

      frameWidth = sheetImg.width / cols;
      frameHeight = sheetImg.height / rows;
      canvas.width = frameWidth;
      canvas.height = frameHeight;

      currentFrame = 0;
      interval = setInterval(() => {
        const totalFrames = cols * rows;
        const col = currentFrame % cols;
        const row = Math.floor(currentFrame / cols);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(
          sheetImg,
          col * frameWidth,
          row * frameHeight,
          frameWidth,
          frameHeight,
          0,
          0,
          frameWidth,
          frameHeight
        );

        currentFrame = (currentFrame + 1) % totalFrames;
      }, speed);
    }
  </script>
</body>
</html>
