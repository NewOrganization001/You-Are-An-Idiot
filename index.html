<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid black;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Dino Runner</h1>
    <p>Presiona espacio para saltar</p>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let dino = { x: 50, y: 150, width: 30, height: 30, velocityY: 0, gravity: 1 };
        let obstacle = { x: 800, y: 150, width: 30, height: 30 };
        let isJumping = false;
        let gameOver = false;
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "green";
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            ctx.fillStyle = "red";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        }
        
        function update() {
            if (!gameOver) {
                dino.velocityY += dino.gravity;
                dino.y += dino.velocityY;
                if (dino.y > 150) { dino.y = 150; isJumping = false; }
                
                obstacle.x -= 5;
                if (obstacle.x < -30) obstacle.x = 800;
                
                if (dino.x < obstacle.x + obstacle.width &&
                    dino.x + dino.width > obstacle.x &&
                    dino.y < obstacle.y + obstacle.height &&
                    dino.y + dino.height > obstacle.y) {
                    gameOver = true;
                    alert("¡Perdiste! Recarga para jugar otra vez.");
                }
            }
        }
        
        function gameLoop() {
            draw();
            update();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space" && !isJumping) {
                dino.velocityY = -12;
                isJumping = true;
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
